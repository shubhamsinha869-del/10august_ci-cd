```yaml
trigger:
  branches:
    include:
      - feature/resource-group

pool:
  vmImage: ubuntu-latest

stages:

# =========================================================
# CI STAGE
# =========================================================

- stage: CI
  displayName: Terraform CI

  jobs:
  - job: TerraformCI
    displayName: Terraform Validation and Plan

    steps:

    # -----------------------------------------------------
    # 1. Install Terraform
    # -----------------------------------------------------

    - script: |
        TERRAFORM_VERSION="1.15.5"

        echo "Installing Terraform ${TERRAFORM_VERSION}"

        curl -fsSL \
          https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip \
          -o terraform.zip

        unzip terraform.zip

        sudo mv terraform /usr/local/bin/

        terraform version
      displayName: Install Terraform


    # -----------------------------------------------------
    # 2. Terraform Init
    # -----------------------------------------------------

    - script: |
        terraform init
      displayName: Terraform Init


    # -----------------------------------------------------
    # 3. Terraform Format Check
    # -----------------------------------------------------

    - script: |
        terraform fmt -check -recursive
      displayName: Terraform Format Check


    # -----------------------------------------------------
    # 4. Terraform Validate
    # -----------------------------------------------------

    - script: |
        terraform validate
      displayName: Terraform Validate


    # -----------------------------------------------------
    # 5. Install TFLint
    # -----------------------------------------------------

    - script: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

        tflint --version
      displayName: Install TFLint


    # -----------------------------------------------------
    # 6. Run TFLint
    # -----------------------------------------------------

    - script: |
        tflint --init
        tflint
      displayName: TFLint


    # -----------------------------------------------------
    # 7. Terraform Plan
    # -----------------------------------------------------

    - script: |
        terraform plan -out=tfplan
      displayName: Terraform Plan


    # -----------------------------------------------------
    # 8. Publish Terraform Plan
    # -----------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: 'tfplan'
        artifact: 'terraform-plan'


# =========================================================
# CD STAGE
# =========================================================

- stage: CD
  displayName: Terraform CD

  dependsOn: CI

  condition: succeeded()

  jobs:

  # -------------------------------------------------------
  # Deployment Job
  # -------------------------------------------------------

  - deployment: TerraformApply
    displayName: Terraform Apply

    # Azure DevOps Environment
    environment: terraform-prod

    strategy:
      runOnce:

        deploy:
          steps:

          # ------------------------------------------------
          # 1. Install Terraform
          # ------------------------------------------------

          - script: |
              TERRAFORM_VERSION="1.15.5"

              echo "Installing Terraform ${TERRAFORM_VERSION}"

              curl -fsSL \
                https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip \
                -o terraform.zip

              unzip terraform.zip

              sudo mv terraform /usr/local/bin/

              terraform version
            displayName: Install Terraform


          # ------------------------------------------------
          # 2. Download Plan Artifact
          # ------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: Download Terraform Plan
            inputs:
              artifact: terraform-plan
              path: $(Pipeline.Workspace)/terraform-plan


          # ------------------------------------------------
          # 3. Terraform Init
          # ------------------------------------------------

          - script: |
              terraform init
            displayName: Terraform Init


          # ------------------------------------------------
          # 4. Terraform Apply
          # ------------------------------------------------

          - script: |
              terraform apply -auto-approve \
                $(Pipeline.Workspace)/terraform-plan/tfplan
            displayName: Terraform Apply

