# ============================================================ # 1. TRIGGER # ============================================================ # Jab feature/resource-group branch par push hoga, # pipeline automatically trigger hogi. trigger: branches: include: - feature/resource-group # ============================================================ # 2. AGENT / POOL # ============================================================ # Azure DevOps ek Ubuntu machine provide karega. # Isi machine par Terraform commands run hongi. pool: vmImage: ubuntu-latest # ============================================================ # 3. STAGES # ============================================================ # Pipeline ko do stages mein divide kar rahe hain: # # CI = Terraform code check + plan # CD = Actual Terraform apply # # Flow: # CI -> CD stages: # ============================================================ # 4. CI STAGE # ============================================================ - stage: CI displayName: Terraform CI # CI stage ke andar ek job banayi. jobs: - job: TerraformCI displayName: Terraform Validation and Plan # Job ke andar actual commands/steps chalenge. steps: # -------------------------------------------------------- # 5. TERRAFORM VERSION # -------------------------------------------------------- # Check karega ki agent par Terraform available hai. - script: | terraform version displayName: Terraform Version # -------------------------------------------------------- # 6. TERRAFORM INIT # -------------------------------------------------------- # Terraform ko initialize karta hai. # Providers, modules aur backend initialize/download hote hain. - script: | terraform init displayName: Terraform Init # -------------------------------------------------------- # 7. TERRAFORM FORMAT CHECK # -------------------------------------------------------- # Check karega ki Terraform files properly formatted hain. # # -check ka matlab: # Sirf check karo, automatically format mat karo. - script: | terraform fmt -check displayName: Terraform Format Check # -------------------------------------------------------- # 8. TERRAFORM VALIDATE # -------------------------------------------------------- # Terraform configuration ki syntax aur configuration # validity check karega. - script: | terraform validate displayName: Terraform Validate # -------------------------------------------------------- # 9. TERRAFORM PLAN # -------------------------------------------------------- # Terraform batayega ki infrastructure mein kya changes # hone wale hain. # # IMPORTANT: # terraform plan actual resource create nahi karta. - script: | terraform plan displayName: Terraform Plan # ============================================================ # 10. CD STAGE # ============================================================ # CI successful hone ke baad CD stage chalega. # Yahan actual infrastructure deploy hoga. - stage: CD displayName: Terraform CD jobs: # ---------------------------------------------------------- # 11. DEPLOYMENT JOB # ---------------------------------------------------------- # Normal job ke badle deployment job use kar rahe hain, # kyunki hum Azure DevOps Environment use karenge. - deployment: TerraformApply displayName: Terraform Apply # -------------------------------------------------------- # 12. AZURE DEVOPS ENVIRONMENT # -------------------------------------------------------- # Azure DevOps mein jo Environment humne create kiya tha: # # terraform-prod # # Us Environment ko is deployment job se connect kar rahe hain. environment: terraform-prod # -------------------------------------------------------- # 13. DEPLOYMENT STRATEGY # -------------------------------------------------------- # runOnce ka matlab deployment ko ek baar run karo. strategy: runOnce: deploy: # Deployment ke andar actual steps. steps: # -------------------------------------------------- # 14. TERRAFORM INIT # -------------------------------------------------- # CD agent fresh machine ho sakta hai, # isliye Terraform ko dobara initialize kar rahe hain. - script: | terraform init displayName: Terraform Init # -------------------------------------------------- # 15. TERRAFORM APPLY # -------------------------------------------------- # Ye actual Azure infrastructure create/update karega. # # -auto-approve ka matlab: # Terraform manually "yes" nahi puchega. - script: | terraform apply -auto-approve displayName: Terraform Apply