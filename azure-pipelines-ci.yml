trigger:
  branches:
    include:
      - feature/resource-group

pool:
  vmImage: ubuntu-latest

stages:

- stage: CI
  displayName: Terraform CI

  jobs:
  - job: TerraformCI
    displayName: Terraform Validation and Plan

    steps:

    # 1. Install Terraform
    - script: |
        TERRAFORM_VERSION="1.15.5"

        echo "Installing Terraform ${TERRAFORM_VERSION}"

        curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -o terraform.zip

        unzip -o terraform.zip

        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: Install Terraform


    # 2. Terraform Init
    - script: |
        terraform init -upgrade
      displayName: Terraform Init


    # 3. Terraform Format Check
    - script: |
        terraform fmt -check -recursive
      displayName: Terraform Format Check


    # 4. Terraform Validate
    - script: |
        terraform validate
      displayName: Terraform Validate


    # 5. Azure Login + Terraform Plan using OIDC
    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: 'terraform-azure-connection'
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true

        inlineScript: |
          echo "Checking Azure authentication..."

          az account show

          echo "Setting Terraform OIDC variables..."

          export ARM_USE_OIDC=true
          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          export ARM_OIDC_TOKEN=$idToken

          echo "Terraform OIDC configuration:"
          echo "ARM_USE_OIDC=$ARM_USE_OIDC"
          echo "ARM_CLIENT_ID is set"
          echo "ARM_TENANT_ID is set"
          echo "ARM_SUBSCRIPTION_ID=$ARM_SUBSCRIPTION_ID"
          echo "ARM_OIDC_TOKEN is set"

          echo "Running Terraform Plan..."

          terraform plan